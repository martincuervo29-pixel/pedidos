<!DOCTYPE html><html><head><title>Pedido mayorista — Artiko</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#eef2f6;margin:0;padding:14px}
.c{max-width:560px;margin:auto;background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px #0002}
h1{color:#12203a;font-size:22px;margin:0 0 6px}label{display:block;font-weight:700;margin:14px 0 4px}
input{font-size:17px;padding:9px;width:100%;box-sizing:border-box;border:1px solid #9aa;border-radius:6px}
button{margin-top:18px;width:100%;font-size:19px;font-weight:700;padding:14px;border:0;border-radius:8px;background:#1565c0;color:#fff}
button:disabled{background:#90a4ae}.tb{display:flex;gap:8px;margin:12px 0 4px}.tb button{margin:0;font-size:16px;padding:10px;background:#90a4ae}.tb button.on{background:#12203a}textarea{width:100%;box-sizing:border-box;height:220px;font-size:14px;border:1px solid #9aa;border-radius:6px;padding:8px}#m{font-size:17px;margin-top:14px;font-weight:700;white-space:pre-line}</style></head>
<body><div class="c"><h1>📦 Pedido mayorista — Artiko</h1>
<div>Cargá el pedido <b>tal cual lo mandó el cliente</b> (no lo modifiques) y completá los datos.</div>
<div class="tb"><button id="tx1" class="on" onclick="modo('xls')">📄 Me lo mandó en Excel</button><button id="tx2" onclick="modo('wa')">💬 Me lo mandó por WhatsApp</button></div>
<div id="pxls"><label>Excel del pedido</label><input type="file" id="xls" accept=".xlsx,.xlsm"></div>
<div id="pwa" style="display:none"><label>Pegá acá el mensaje de WhatsApp completo</label>
<textarea id="wa" placeholder="Hola Valeria! Soy ... Te paso mi pedido mayorista Artiko:&#10;&#10;Funda Silicone Efecto Relieve 3D&#10;* 48J Moto Edge 20 Pro x2&#10;    - D6 Mariposas x1&#10;..."></textarea></div>
<label>Nombre del cliente</label><input id="cli" placeholder="ej: CIAMPORCELO PILAR">
<label>ID del cliente</label><input id="idc" inputmode="numeric" placeholder="ej: 35108">
<label>Tu nombre</label><input id="ven" placeholder="ej: Denisse">
<label>Aclaraciones (opcional)</label><textarea id="nota" style="height:80px" placeholder="ej: las de Moto G15 que sean todas negras · es urgente · ..."></textarea>
<button id="b">ENVIAR PEDIDO</button><div id="m"></div></div>
<script>
const SERVIDOR='https://script.google.com/macros/s/AKfycbyQoZPeZZW6SvHBwFNbx89W2VMe0LkCGA46dj-GlKoTKvxGTA4D64pvHIqCf3qmyzSNag/exec';
const $=id=>document.getElementById(id),m=$('m');
try{$('ven').value=localStorage.getItem('vendedora')||'';}catch(e){}
let MODO='xls';
function modo(k){MODO=k;$('pxls').style.display=k=='xls'?'':'none';$('pwa').style.display=k=='wa'?'':'none';
 $('tx1').className=k=='xls'?'on':'';$('tx2').className=k=='wa'?'on':'';m.textContent='';}
function revisarWa(t){            // obligatorio: el formato del mensaje de pedido (producto + renglones con *)
  let n=0,fundas=0,prod='';
  for(const l0 of t.split('\n')){const l=l0.trim();if(!l)continue;if(l.startsWith('---'))break;
    const it=l.match(/^[*•]\s*\S+\s+.+?[x×]\s*(\d+)\s*$/i);
    if(it){n++;if(/relieve|tpupc/i.test(prod))fundas+=Number(it[1]);}
    else if(!/^[-–·]/.test(l)&&!/^(unidades|subtotal|iva|total|descuento|\(lista)/i.test(l))prod=l;}
  if(!n)throw 'Eso no es el pedido como lo manda el cliente: tienen que estar los productos y debajo los renglones que empiezan con * (ej: * 3Zy iPhone 17 Pro x100). Copiá el mensaje completo de WhatsApp.';
  return {n,fundas};
}
const mal=t=>{m.style.color='#c62828';m.textContent=t;$('b').disabled=false;};
function revisar(buf){            // obligatorio: tiene que ser la lista mayorista con la hoja MI PEDIDO
  const wb=XLSX.read(buf,{type:'array'});
  const nom=wb.SheetNames.find(n=>n.replace(/\W/g,'').toUpperCase()=='MIPEDIDO');
  if(!nom)throw 'Ese archivo no es la lista mayorista de Artiko (no tiene la hoja MI PEDIDO). Subí el Excel tal cual lo mandó el cliente.';
  const filas=XLSX.utils.sheet_to_json(wb.Sheets[nom],{header:1,defval:''});
  let col=null,n=0,fundas=0;
  for(const f of filas){const up=f.map(x=>String(x).trim().toUpperCase());
    if(!col){const i=k=>up.findIndex(t=>t.startsWith(k));
      if(up.includes('CÓDIGO')||up.includes('CODIGO'))col={p:i('PRODUCTO'),c:i('CANTIDAD')};continue;}
    const cant=Number(f[col.c]);if(!String(f[col.p]).trim()||!(cant>0))continue;
    n++;if(/relieve|tpupc/i.test(f[col.p]))fundas+=cant;}
  if(!col)throw 'No encontré la tabla del pedido en la hoja MI PEDIDO. Subí el Excel sin modificarlo.';
  if(!n)throw 'La hoja MI PEDIDO está vacía. Abrí el Excel, tocá Guardar y volvé a subirlo.';
  return {n,fundas,filas};
}
$('b').onclick=async()=>{
  const f=$('xls').files[0],wa=$('wa').value.trim(),cli=$('cli').value.trim(),idc=$('idc').value.trim(),ven=$('ven').value.trim();
  if(MODO=='xls'&&!f)return mal('Elegí el archivo Excel del pedido');
  if(MODO=='wa'&&!wa)return mal('Pegá el mensaje de WhatsApp del pedido');
  if(!cli)return mal('Falta el nombre del cliente');
  if(!/^\d{3,8}$/.test(idc))return mal('El ID del cliente tiene que ser solo números (ej: 35108)');
  if(!ven)return mal('Poné tu nombre');
  try{localStorage.setItem('vendedora',ven);}catch(e){}
  $('b').disabled=true;m.style.color='#555';m.textContent='Revisando el pedido…';
  let r,envio={cliente:cli,id:idc,vendedora:ven};const nota=$('nota').value.trim();
  if(MODO=='wa'){try{r=revisarWa(wa);}catch(e){return mal(e);}envio.texto=wa+(nota?'\n### ACLARACIONES ###\n'+nota:'');}
  else{let buf;try{buf=await f.arrayBuffer();r=revisar(buf);}catch(e){return mal(typeof e=='string'?e:'No pude abrir el archivo. Tiene que ser el Excel (.xlsx) de la lista mayorista.');}
    // se manda solo la hoja MI PEDIDO (el Excel completo trae fotos y pesa ~20 MB)
    const wb2=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb2,XLSX.utils.aoa_to_sheet(r.filas),'MI PEDIDO');
    if(nota)XLSX.utils.book_append_sheet(wb2,XLSX.utils.aoa_to_sheet([[nota]]),'ACLARACIONES');
    envio.data=XLSX.write(wb2,{type:'base64',bookType:'xlsx'});}
  if(!r.fundas){m.style.color='#2e7d32';$('b').disabled=false;
    return m.textContent='Este pedido no tiene fundas para producción (relieve / TpuPc): no hace falta mandarlo a la fábrica. ✔';}
  m.textContent='Enviando…';
  const ok=()=>{m.style.color='#2e7d32';
      m.textContent='\u2714 Pedido enviado: '+r.n+' renglones ('+r.fundas+' fundas para imprimir).\nCliente: '+cli.toUpperCase()+' \u00b7 ID '+idc+(nota?'\n\ud83d\udcdd Con aclaraci\u00f3n':'');
      ['xls','wa','cli','idc','nota'].forEach(k=>$(k).value='');$('b').disabled=false;};
  try{const resp=await fetch(SERVIDOR,{method:'POST',body:JSON.stringify(envio),credentials:'omit'});const js=await resp.json();
    if(js.ok)ok();else mal('No se pudo enviar: '+js.error+'\nProb\u00e1 de nuevo.');}
  catch(e){mal('No se pudo enviar (revis\u00e1 que tengas internet) y prob\u00e1 de nuevo.');}
};
</script></body></html>
